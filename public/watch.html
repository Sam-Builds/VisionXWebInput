<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionX WebInput — Live Stream</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141613;
      color: #f7f8f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    video {
      max-width: 100%;
      max-height: 82vh;
      border-radius: 12px;
      background: #000;
      border: 1px solid #333a2f;
    }
    footer {
      padding: 14px 24px;
      background: #1d211c;
      border-top: 1px solid #2c3228;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .btn {
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #333a2f;
      background: #252a23;
      color: #f7f8f4;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
    }
    .url { font-family: monospace; font-size: 12px; color: #ccd5ae; }
  </style>
</head>
<body>
  <main>
    <video id="player" controls autoplay playsinline></video>
  </main>
  <footer>
    <div>
      <span style="font-weight:700;">Live Stream</span>
      <span id="directLabel" class="url" style="margin-left:10px;"></span>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="copyBtn" class="btn">Copy Direct Video URL</button>
      <a id="backBtn" class="btn" href="../">Broadcast Page</a>
    </div>
  </footer>
  <script>
    const parts = window.location.pathname.replace(/\/+$/, '').split('/');
    const streamId = parts[parts.length - 1];
    const base = window.location.pathname.replace(/\/watch\/[^/]+\/?$/, '');
    const streamUrl = `${window.location.origin}${base}/stream/${streamId}`;

    const player = document.getElementById('player');
    player.src = streamUrl;
    document.getElementById('directLabel').textContent = streamUrl;
    document.getElementById('backBtn').href = `${base || '/'}`;
    document.getElementById('copyBtn').onclick = () => navigator.clipboard.writeText(streamUrl);
  </script>
</body>
</html>
